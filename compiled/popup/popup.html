<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lamiss Transcript POC</title>
  <style>
    body {
      width: 280px;
      min-height: 220px;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #1f2937;
    }
    h1 {
      font-size: 16px;
      text-align: center;
      margin: 0 0 12px;
    }
    .field {
      margin: 12px 0;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    select,
    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      font-size: 12px;
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      background: #e5e7eb;
      min-height: 34px;
    }
  </style>
</head>
<body>
  <h1>LAMISS</h1>
  <div class="field">
    <label for="language">Language:</label>
    <select id="language">
      <option value="en">English</option>
      <option value="es">Spanish</option>
    </select>
  </div>

  <div class="field">
    <button id="loadTranscript">Load Transcript</button>
  </div>

  <div id="status">Status: Ready</div>

  <script src="popup.js"></script>
</body>
</html>
