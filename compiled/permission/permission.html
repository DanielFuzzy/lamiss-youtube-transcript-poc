<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lamiss Microphone Access</title>
  <style>
    :root {
      --bg: #12081f;
      --surface: rgba(39, 23, 66, 0.72);
      --border: rgba(196, 167, 255, 0.16);
      --text: #f5f0ff;
      --muted: #b4a3d6;
      --accent: #8b5cf6;
      --accent-strong: #7c3aed;
      --pink: #e879f9;
      --success: #6ee7b7;
      --error: #fda4af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(80% 60% at 10% 0%, #4c1d95 0%, transparent 60%),
        radial-gradient(70% 50% at 90% 10%, #6b21a8 0%, transparent 55%),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 16px;
      font-size: 24px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--accent) 0%, var(--pink) 100%);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.5;
      color: var(--muted);
    }

    #micStatus.granted {
      color: var(--success);
    }

    #micStatus.denied {
      color: var(--error);
    }

    button {
      height: 40px;
      padding: 0 20px;
      font: inherit;
      font-weight: 600;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--accent-strong);
    }

    button:hover {
      background: var(--accent);
    }

    button[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">L</div>
    <h1>Enable your microphone</h1>
    <p id="micStatus" aria-live="polite">Lamiss needs microphone access so you can ask questions out loud. Chrome will ask you once.</p>
    <button id="grantMic">Allow microphone</button>
  </main>
  <script src="permission.js"></script>
</body>
</html>
