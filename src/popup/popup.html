<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lamiss Transcript POC</title>
  <style>
    :root {
      --bg: #12081f;
      --surface: rgba(39, 23, 66, 0.72);
      --surface-strong: #2a1847;
      --border: rgba(196, 167, 255, 0.16);
      --text: #f5f0ff;
      --muted: #b4a3d6;
      --accent: #8b5cf6;
      --accent-strong: #7c3aed;
      --accent-soft: #c4b5fd;
      --pink: #e879f9;
      --recording: #f43f5e;
      --error: #fda4af;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      width: 340px;
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--text);
      background:
        radial-gradient(120% 70% at 0% 0%, #4c1d95 0%, transparent 60%),
        radial-gradient(90% 60% at 100% 10%, #6b21a8 0%, transparent 55%),
        var(--bg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 6px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 19px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, var(--accent) 0%, var(--pink) 100%);
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.45);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .tagline {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: var(--muted);
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 14px 16px;
    }

    .card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      backdrop-filter: blur(8px);
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-soft);
    }

    /* Ask Lamiss */
    .ask {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ask .card-title {
      align-self: flex-start;
    }

    .mic {
      position: relative;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 6px 0 10px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent) 0%, var(--pink) 100%);
      box-shadow: 0 10px 28px rgba(139, 92, 246, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    .mic:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 14px 34px rgba(168, 85, 247, 0.6);
    }

    .mic:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 4px;
    }

    .mic svg {
      width: 30px;
      height: 30px;
    }

    .mic .icon-stop,
    .mic .spinner {
      display: none;
    }

    .mic[data-state='recording'] {
      background: linear-gradient(135deg, var(--recording) 0%, var(--pink) 100%);
      box-shadow: 0 10px 28px rgba(244, 63, 94, 0.5);
    }

    .mic[data-state='recording']::before,
    .mic[data-state='recording']::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(244, 63, 94, 0.6);
      animation: pulse 1.6s ease-out infinite;
    }

    .mic[data-state='recording']::after {
      animation-delay: 0.8s;
    }

    .mic[data-state='recording'] .icon-mic {
      display: none;
    }

    .mic[data-state='recording'] .icon-stop {
      display: block;
    }

    .mic[data-state='sending'] {
      cursor: progress;
      opacity: 0.85;
    }

    .mic[data-state='sending'] .icon-mic {
      display: none;
    }

    .mic[data-state='sending'] .spinner {
      display: block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(1.6); opacity: 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hint {
      margin: 0;
      min-height: 17px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .answer {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      background: var(--surface-strong);
      border: 1px solid var(--border);
    }

    .answer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-soft);
    }

    .answer-meta {
      font-weight: 500;
      color: var(--muted);
    }

    .answer p {
      margin: 0;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .answer.error p {
      color: var(--error);
    }

    /* Transcript */
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .transcript-hint {
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      font: inherit;
      border-radius: 10px;
    }

    .btn {
      border: none;
      font-weight: 600;
      color: white;
      cursor: pointer;
      background: var(--accent-strong);
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 2px;
    }

    .status {
      margin-top: 10px;
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 10px;
      color: var(--muted);
      background: rgba(18, 8, 31, 0.55);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="brand">
    <div class="logo" aria-hidden="true">L</div>
    <div>
      <h1>Lamiss</h1>
      <p class="tagline">Your YouTube learning companion</p>
    </div>
  </header>

  <main>
    <section class="card ask">
      <h2 class="card-title">Ask Lamiss</h2>
      <button id="askButton" class="mic" data-state="idle" aria-label="Start recording your question">
        <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 10a7 7 0 0 0 14 0" />
          <line x1="12" y1="17" x2="12" y2="22" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2.5" />
        </svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p id="askHint" class="hint" aria-live="polite">Tap the mic and ask about this moment</p>
      <div id="answer" class="answer" hidden>
        <div class="answer-header">
          <span>Lamiss</span>
          <span id="answerMeta" class="answer-meta"></span>
        </div>
        <p id="answerText"></p>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Transcript</h2>
      <p class="hint transcript-hint">Uses the video's own caption language.</p>
      <div class="row">
        <button id="loadTranscript" class="btn">Load Transcript</button>
      </div>
      <div id="status" class="status" aria-live="polite">Status: Ready</div>
    </section>
  </main>

  <script src="../shared/lamiss-config.js"></script>
  <script src="../shared/lamiss-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
